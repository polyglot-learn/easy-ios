name: Example apps

on:
  push:
    branches: [main]
    paths: ["examples/**", "scripts/**", ".swift-format", "Makefile", ".github/workflows/examples.yml"]
  pull_request:
    paths: ["examples/**", "scripts/**", ".swift-format", "Makefile", ".github/workflows/examples.yml"]
  workflow_dispatch:

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: make lint

  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [Tasks, Habits, Budget, Flashcards, Recipes, MoodJournal, Packing, Converter, Forecast, Headlines]
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: xcodebuild -version
      - run: make test APP=examples/${{ matrix.app }}
